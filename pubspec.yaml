publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_markdown: ^0.7.1
  flutter_highlight: ^0.7.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.0
  uuid: ^4.4.0
  glob: ^2.1.2
  file_picker: ^8.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
